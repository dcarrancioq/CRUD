<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <a routerLink="/" class="brand">
        <i class="bi bi-shop"></i>
        <span>E-Commerce</span>
      </a>
      <h1>Iniciar sesion</h1>
      <p>Accede a tu cuenta para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" 
               class="form-control" 
               formControlName="email"
               [class.is-invalid]="isFieldInvalid('email')"
               placeholder="tu@email.com">
        <div class="invalid-feedback">
          Introduce un email valido
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Contrasena</label>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'" 
                 class="form-control" 
                 formControlName="password"
                 [class.is-invalid]="isFieldInvalid('password')"
                 placeholder="Tu contrasena">
          <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
        <div *ngIf="isFieldInvalid('password')" class="text-danger small mt-1">
          La contrasena debe tener al menos 6 caracteres
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" formControlName="rememberMe" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Recordarme</label>
        </div>
        <a routerLink="/auth/forgot-password" class="forgot-link">Olvidaste tu contrasena?</a>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Iniciando sesion...' : 'Iniciar sesion' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>No tienes cuenta? <a routerLink="/auth/register">Registrate</a></p>
    </div>
  </div>
</div>
