<header class="site-header">
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand" routerLink="/">
        <i class="bi bi-shop"></i>
        <span>E-Commerce</span>
      </a>

      <button class="navbar-toggler" type="button" (click)="toggleMenu()">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/products" routerLinkActive="active" (click)="closeMenus()">
              Productos
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/categories" routerLinkActive="active" (click)="closeMenus()">
              Categorias
            </a>
          </li>
        </ul>

        <div class="navbar-nav">
          <a class="nav-link position-relative" routerLink="/cart" (click)="closeMenus()">
            <i class="bi bi-cart3 fs-5"></i>
            <span *ngIf="cartCount > 0" class="cart-badge">{{ cartCount }}</span>
          </a>

          <a *ngIf="currentUser" class="nav-link" routerLink="/wishlist" (click)="closeMenus()">
            <i class="bi bi-heart fs-5"></i>
          </a>

          <div *ngIf="!currentUser" class="nav-item">
            <a class="nav-link" routerLink="/auth/login" (click)="closeMenus()">
              <i class="bi bi-person fs-5"></i>
              <span class="d-lg-none ms-2">Iniciar sesion</span>
            </a>
          </div>

          <div *ngIf="currentUser" class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="javascript:void(0)" (click)="toggleUserMenu()">
              <i class="bi bi-person-circle fs-5"></i>
              <span class="d-lg-none ms-2">{{ currentUser.firstName }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" [class.show]="isUserMenuOpen">
              <li class="dropdown-header">
                Hola, {{ currentUser.firstName }}
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item" routerLink="/orders" (click)="closeMenus()">
                  <i class="bi bi-bag me-2"></i> Mis pedidos
                </a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/wishlist" (click)="closeMenus()">
                  <i class="bi bi-heart me-2"></i> Lista de deseos
                </a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/profile" (click)="closeMenus()">
                  <i class="bi bi-gear me-2"></i> Mi cuenta
                </a>
              </li>
              <li *ngIf="isAdmin"><hr class="dropdown-divider"></li>
              <li *ngIf="isAdmin">
                <a class="dropdown-item" routerLink="/admin" (click)="closeMenus()">
                  <i class="bi bi-speedometer2 me-2"></i> Panel Admin
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item" href="javascript:void(0)" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesion
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
